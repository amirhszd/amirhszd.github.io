<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landsat Pushbroom Acquisition</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="viewer">
    <div id="map" aria-label="Interactive Landsat acquisition map"></div>
    <section class="title-card">
      <p class="eyebrow">DIRSIG Scene Constructor</p>
      <h1>Landsat Pushbroom Simulation</h1>
      <p class="path-label">Path 16</p>
      <p>Bands 2 (Blue), 3 (Green), and 4 (Red) RGB visualization</p>
    </section>
    <section class="controls" aria-label="Animation controls">
      <div class="transport">
        <button id="play" type="button" aria-label="Play or pause" disabled>▶</button>
        <button id="reverse" type="button" aria-label="Play backward" disabled>↶</button>
        <output id="clock">00:00.00</output>
        <output id="utc">Loading…</output>
      </div>
      <input id="timeline" type="range" min="0" max="300" step="0.01" value="0" aria-label="Acquisition time" disabled>
      <div class="settings">
        <label>Speed
          <input id="speed" type="range" min="-10" max="10" step="0.25" value="4">
          <output id="speed-value">4×</output>
        </label>
        <label>Imagery
          <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.9">
          <output id="opacity-value">90%</output>
        </label>
        <label class="check"><input id="follow" type="checkbox" checked> Follow satellite</label>
        <button id="reset" type="button">Full route</button>
      </div>
    </section>
    <canvas id="active-canvas" hidden></canvas>
  </main>
  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
