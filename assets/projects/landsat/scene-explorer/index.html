<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landsat scene explorer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="viewer.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script><script src="data.js" defer></script><script src="viewer.js" defer></script></head><body>
<main><header><p class="eyebrow">LANDSAT / SCENE EXPLORER</p><h1>Surface temperature & atmospheric water vapor</h1><div class="toolbar"><label>Scene<select id="scene"></select></label><button id="fit" type="button">Zoom to scene</button><label class="opacity">Overlay opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="1"></label></div><div id="products" role="group" aria-label="Raster layers"></div><section class="context" aria-live="polite"><h2 id="title">Loading scenes…</h2><p id="description"></p><p id="observation"></p></section></header>
<div class="map-wrap"><div id="map" aria-label="Interactive scene map"></div><aside id="legend"><b id="legend-title"></b><div id="gradient"></div><div id="ticks"></div><p id="legend-note"></p></aside><p id="status" role="status">Loading viewer…</p></div><footer>Source rasters: 100 m. Display images are resampled and color-scaled; zooming does not add spatial detail. Transparent areas indicate missing data.</footer></main></body></html>
