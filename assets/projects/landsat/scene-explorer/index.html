<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Landsat Scene Explorer</title>
  <link rel="stylesheet" href="viewer.css">
  <script src="data.js" defer></script>
  <script src="viewer.js" defer></script>
</head>
<body>
  <div class="viewer-container" id="viewer-container" aria-label="Interactive Landsat scene explorer">
    <!-- Image Display Viewport -->
    <div class="viewport" id="viewport"></div>

    <!-- Top-Left Narrative Textbox -->
    <div class="textbox-left" id="story-box" aria-live="polite">
      <div class="step-badge" id="story-step"></div>
      <h2 class="story-title" id="title">Loading...</h2>
      <p class="story-description" id="description"></p>
    </div>

    <!-- Top-Center Navigation Controls -->
    <div class="controls-center" id="controls" aria-label="Scene explorer controls">
      <button id="previous" class="control-btn" type="button" disabled>← Back</button>
      <button id="next" class="control-btn" type="button">Next →</button>
      <button id="next-scene" class="control-btn" type="button">Next Scene ↻</button>
    </div>

    <!-- Bottom-Left Scene Metadata -->
    <div class="scene-id-left" id="scene-id" aria-live="polite"></div>

    <!-- Bottom-Center Colorbar Legend -->
    <div class="legend-center" id="legend">
      <div class="legend-header">
        <span class="raster-name" id="legend-title"></span>
      </div>
      <div class="colorbar-container" id="colorbar-container">
        <div class="gradient" id="gradient"></div>
        <div class="ticks" id="ticks"></div>
      </div>
      <div class="legend-note" id="legend-note"></div>
    </div>

    <!-- Loading Indicator / Status -->
    <div class="status-overlay" id="status" role="status">Loading viewer...</div>
  </div>
</body>
</html>
