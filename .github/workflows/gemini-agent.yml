name: Gemini AI Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gemini-review:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run Gemini Agent
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          prompt: "Analyze the code changes in this pull request and suggest optimizations."
